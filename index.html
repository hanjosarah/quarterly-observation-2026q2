<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>锂钠电产业链季度观察</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #f4f7fb;
      color: #ffffff;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    header {
      width: 100%;
      padding: 30px clamp(20px, 5vw, 72px);
      background: linear-gradient(135deg, #071a35 0%, #0c3567 58%, #12639b 100%);
      box-shadow: 0 8px 24px rgba(4, 25, 53, 0.18);
    }
    h1 {
      margin: 0 0 13px;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.25;
      letter-spacing: 0.02em;
    }
    .bracket { color: #6fd4ff; }
    p {
      margin: 5px 0 0;
      color: #dbeeff;
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.7;
    }
    @media (max-width: 600px) {
      header { padding: 24px 18px; }
      h1 { font-size: 25px; }
      p { font-size: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="bracket">【璞泰来】</span>锂电&amp;钠电产业链季度观察</h1>
    <p>车辆数据更新至26年5月，其他数据更新至26年6月</p>
    <p>撰写成员：市场部——张飞虎、程伍丹、李逸竹、王瑜珊、冯铂健；投资部——周涵、邹辰颢</p>
  </header>
</body>
</html>
